[profile.default]
src = "evm/src"
test = "evm/test"
out = "out"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 1
ignored_warnings_from = [
    ".data/evm/generated/SettlementHonkVerifier.sol",
]
fs_permissions = [{ access = "read", path = "./.data/evm/testdata" }]

[dependencies]
forge-std = "1.15.0"
openzeppelin-contracts = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.6.1" }

[lint]
ignore = [
    ".data/evm/generated/SettlementHonkVerifier.sol",
]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
