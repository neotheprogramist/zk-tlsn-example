[package]
name = "zktlsn_core"
version.workspace = true
edition.workspace = true

[dependencies]
http-body-util.workspace = true
hyper.workspace = true
pest.workspace = true
pest_derive.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true
smol.workspace = true
tlsn.workspace = true

# When core is compiled to wasm32 (via the zktlsn_core_wasm shell), tlsn needs
# its `web` feature to link against the browser-compatible primitives, and
# parking_lot's nightly feature is required by tlsn's MPC thread parker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
getrandom = { workspace = true }
getrandom_03 = { workspace = true }
parking_lot = { version = "0.12", features = ["nightly"] }
tlsn = { workspace = true, features = ["web", "mozilla-certs"] }
