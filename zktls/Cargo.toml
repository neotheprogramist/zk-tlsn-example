[package]
name = "zktls"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http-body-util.workspace = true
hyper.workspace = true
pest.workspace = true
pest_derive.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true
smol.workspace = true
tlsn.workspace = true

# Browser build: tlsn needs `web` for browser-compatible primitives, parking_lot
# nightly for tlsn's MPC thread parker, and the wasm-bindgen / web-sys glue used
# by the in-crate wasm module (src/wasm/).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
futures.workspace = true
getrandom = { workspace = true }
getrandom_03 = { workspace = true }
js-sys.workspace = true
parking_lot = { version = "0.12", features = ["nightly"] }
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
tlsn = { workspace = true, features = ["web", "mozilla-certs"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-spawn = "0.2.1"
web-sys = { workspace = true, features = [
  "MessageEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "WebTransportBidirectionalStream",
  "WebTransportReceiveStream",
  "WebTransportSendStream",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "WritableStream",
  "WritableStreamDefaultWriter",
] }
