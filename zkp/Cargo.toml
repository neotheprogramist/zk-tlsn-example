[package]
name = "zkp"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `wasm_bindings` controls the browser-facing wasm-bindgen exports.
# Default-on so the standalone `cargo build -p zkp --target wasm32-unknown-unknown`
# still produces the /assets/wasm/zkp.js bindings. Downstream crates that
# only want the in-process Prover/Verifier API (e.g. `vault`) depend with
# `default-features = false` to avoid duplicate-symbol link errors when
# they build their own wasm module that transitively pulls zkp in.
default = ["wasm_bindings"]
wasm_bindings = []

[dependencies]
bincode.workspace = true
serde = { workspace = true }
thiserror.workspace = true

# stwo + stwo-circuits — sourced from root [workspace.dependencies].
stwo = { workspace = true, features = ["prover", "std"] }
stwo-constraint-framework = { workspace = true, features = ["prover", "std"] }
circuits.workspace = true
circuit-common.workspace = true
circuit-prover.workspace = true
circuit-verifier.workspace = true
circuits-stark-verifier.workspace = true
circuits-stark-verifier-examples.workspace = true
num-traits.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
getrandom.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
