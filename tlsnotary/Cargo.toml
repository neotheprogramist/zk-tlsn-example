[package]
name = "tlsnotary"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
pest.workspace = true
pest_derive.workspace = true
pin-project-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smol.workspace = true
tlsn.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
getrandom = { workspace = true }
getrandom_03 = { workspace = true }
js-sys.workspace = true
# parking_lot's `nightly` feature enables the Atomics.wait-based thread parker
# on wasm32. Without it the parker's slow path panics with `unreachable`.
parking_lot = { version = "0.12", features = ["nightly"] }
serde-wasm-bindgen.workspace = true
tlsn = { workspace = true, features = ["web", "mozilla-certs"] }
tracing-web.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-spawn = "0.2.1"
web-sys = { workspace = true, features = [
    "MessageEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WebTransportBidirectionalStream",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }
