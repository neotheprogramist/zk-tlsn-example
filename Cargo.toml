[workspace]
resolver = "3"
members = ["parser", "server", "shared", "stwo-circuits", "tlsnotary", "verifier", "zktlsn"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
alloy = { version = "1.0.41", features = ["full"] }
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
async-compat = "0.2.5"
axum = "0.8.8"
blake3 = "1.8.2"
clap = { version = "4.6.0", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
futures-rustls = "0.26.0"
flate2 = "1.1.5"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = "1.8.1"
hyper-util = { version = "0.1.20", features = ["client", "http2"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
parser = { path = "./parser" }
poseidon-m31 = { git = "https://github.com/anhelinakruk/poseidon-m31", branch = "main" }
pem = "3.0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
quinn = { version = "0.11.9", default-features = false, features = [
    "bloom",
    "log",
    "platform-verifier",
    "runtime-smol",
    "rustls-aws-lc-rs",
] }
rangeset = "0.4.0"
rcgen = "0.14.7"
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
server = { path = "./server" }
shared = { path = "./shared" }
smol = "2.0.2"
thiserror = "2.0.18"
tlsn = { git = "https://github.com/neotheprogramist/tlsn", branch = "feat/posiedon-m31" }
tlsnotary = { path = "./tlsnotary" }
tokio = { version = "1.50.0", default-features = false, features = ["io-util"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
verifier = { path = "./verifier" }
zktlsn = { path = "./zktlsn" }
