[workspace]
resolver = "3"
members = ["core", "core-wasm", "demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
askama = "0.15.6"
async-compat = "0.2.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
getrandom = { version = "0.2.15", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3.2", features = ["wasm_js"] }
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "http2", "tokio", "server", "server-auto"] }
js-sys = "0.3.77"
pin-project-lite = "0.2.15"
pem = "3.0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
quinn = { version = "0.11.9", default-features = false, features = [
    "bloom",
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
rcgen = "0.14.7"
rustls = "0.23.39"
salvo = { version = "0.92.1", default-features = false, features = ["http1", "server", "affix-state", "quinn", "serve-static", "rustls"] }
salvo-http3 = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.149"
zktlsn_core = { path = "./core" }
smol = "2.0.2"
thiserror = "2.0.18"
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.14", default-features = false }
tokio = { version = "1.52.1", default-features = false, features = ["io-util", "rt", "rt-multi-thread", "macros", "net", "time", "process", "fs"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.77"
serde-wasm-bindgen = "0.6.5"
