[workspace]
resolver = "3"
members = ["e2e", "shared", "tlsnotary", "zktlsn"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
alloy = { version = "2.0.1", features = ["full"] }
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
async-compat = "0.2.5"
blake3 = "1.8.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
flate2 = "1.1.5"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "http2", "tokio", "server", "server-auto"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
pem = "3.0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
quinn = { version = "0.11.9", default-features = false, features = [
    "bloom",
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
rcgen = "0.14.7"
rustls = "0.23.39"
salvo = { version = "0.92.1", default-features = false, features = ["http1", "server", "affix-state"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shared = { path = "./shared" }
smol = "2.0.2"
thiserror = "2.0.18"
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.14" }
tlsnotary = { path = "./tlsnotary" }
tokio = { version = "1.52.1", default-features = false, features = ["io-util", "rt", "rt-multi-thread", "macros", "net", "time", "process", "fs"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
zktlsn = { path = "./zktlsn" }
