[workspace]
resolver = "3"
members = ["zktls", "zkp", "vault", "demo"]

# Force stwo-circuits' transitive stwo/stwo-constraint-framework deps to the
# same git rev that `zkp` uses, so cargo doesn't compile two stwo versions
# side-by-side (one from crates.io, one from git).
[patch.crates-io]
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b" }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b" }
stwo-air-utils = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b" }
stwo-air-utils-derive = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b" }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
async-compat = "0.2.5"
bincode = { version = "1.3.3" }
clap = { version = "4.6.1", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
console_error_panic_hook = "0.1.7"
futures = "0.3.32"
getrandom = { version = "0.2.15", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3.2", features = ["wasm_js"] }
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = [
  "client",
  "http2",
  "tokio",
  "server",
  "server-auto",
] }
js-sys = "0.3.77"
pin-project-lite = "0.2.17"
pem = "3.0.4"
pest = "2.8.6"
pest_derive = "2.8.6"
quinn = { version = "0.11.9", default-features = false, features = [
  "bloom",
  "log",
  "platform-verifier",
  "runtime-tokio",
  "rustls-aws-lc-rs",
] }
rcgen = "0.14.7"
rustls = "0.23.40"
salvo = { version = "0.93.0", default-features = false, features = [
  "http1",
  "server",
  "affix-state",
  "quinn",
  "serve-static",
  "rustls",
] }
salvo-http3 = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.149"
zktls = { path = "./zktls" }
smol = "2.0.2"
thiserror = "2.0.18"
tlsn = { git = "https://github.com/neotheprogramist/tlsn", branch = "feat/poseidon-hash-impl", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = [
  "io-util",
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "process",
  "fs",
] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = "0.3.98"
serde-wasm-bindgen = "0.6.5"
num-traits = { version = "0.2", default-features = false }

# stwo + stwo-circuits — pinned git revs so the repo is self-contained.
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b", default-features = false }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "27686b8c4fa4a8d9ec36bf64e320016bc0e7e08b", default-features = false }
circuits = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
circuit-common = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
circuit-prover = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
circuit-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
circuits-stark-verifier-examples = { git = "https://github.com/starkware-libs/stwo-circuits", rev = "5fcc0e7cb4bd755b98cae89280feb45f9f21d5f7" }
